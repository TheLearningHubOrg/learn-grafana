# Overrides on top of Grafana's built-in conf/defaults.ini.
# Anything set here can also be overridden by a GF_<SECTION>_<KEY> environment
# variable, which is how compose.yaml injects the admin password.

[server]
http_addr = 0.0.0.0
http_port = 3000
# Gzip API and asset responses (default since Grafana 13; explicit for older images).
enable_gzip = true

[security]
# Never ship credentials in this file. compose.yaml and CI pass
# GF_SECURITY_ADMIN_PASSWORD at runtime instead.
disable_gravatar = true
# Block the page from being framed by other sites (clickjacking).
allow_embedding = false
# Browsers dropped X-XSS-Protection and Grafana 13 logs a deprecation warning
# while it is on. Rely on content_security_policy instead.
x_xss_protection = false

[users]
allow_sign_up = false
default_theme = system

[auth.anonymous]
# Read-only access for the local lab. Turn this off for any shared instance.
enabled = true
org_name = Main Org.
org_role = Viewer

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

[dashboards]
# Land on the RED dashboard instead of the empty home page.
default_home_dashboard_path = /etc/grafana/dashboards/platform/service-overview.json
# Keep 20 versions per dashboard so a bad save can be rolled back.
versions_to_keep = 20

[log]
mode = console
level = info

[metrics]
# Exposes /metrics for the Prometheus "grafana" scrape job.
enabled = true
