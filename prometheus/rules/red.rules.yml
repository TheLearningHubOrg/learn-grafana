# Recording rules that turn two different metric schemas (Prometheus and
# Grafana name their HTTP metrics differently) into one RED schema:
#   job:http_requests:rate5m                  requests per second
#   job:http_errors:ratio_rate5m              share of 5xx responses (0..1)
#   job:http_request_duration_seconds:p95_5m  95th percentile latency
# Dashboards query these series, so a panel never needs to know which
# exporter produced the raw data.
groups:
  - name: red-normalization
    interval: 15s
    rules:
      # One rule per output name; "or" unions the two sources. Their job
      # labels differ, so neither side hides the other.
      - record: job:http_requests:rate5m
        expr: |
          sum by (job) (rate(prometheus_http_requests_total[5m]))
            or
          sum by (job) (rate(grafana_http_request_duration_seconds_count[5m]))

      - record: job:http_errors:rate5m
        expr: |
          sum by (job) (rate(prometheus_http_requests_total{code=~"5.."}[5m]))
            or
          sum by (job) (rate(grafana_http_request_duration_seconds_count{status_code=~"5.."}[5m]))

      # Rules in a group run in order, so this one sees the two above.
      # The "or ... * 0" branch reports 0 for jobs that never returned a 5xx,
      # instead of leaving the panel empty.
      - record: job:http_errors:ratio_rate5m
        expr: |
          (job:http_errors:rate5m / job:http_requests:rate5m)
            or
          (job:http_requests:rate5m * 0)

      - record: job:http_request_duration_seconds:p95_5m
        expr: |
          histogram_quantile(0.95,
            sum by (job, le) (rate(prometheus_http_request_duration_seconds_bucket[5m]))
              or
            sum by (job, le) (rate(grafana_http_request_duration_seconds_bucket[5m]))
          )
